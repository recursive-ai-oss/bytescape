# cargo-deny configuration: licenses, advisories, bans and sources.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
# ttf-parser is flagged as unmaintained (no known vulnerability). It is reached
# only through fontdb, which cosmic-text uses to find system fonts, and it
# parses font files already installed on the user's machine. It cannot be
# avoided today: fontdb 0.24 no longer depends on it, but the latest
# cosmic-text (0.19) requires fontdb 0.23, and a 0.x requirement does not
# accept 0.24. A discovery path without ttf-parser would mean replacing
# cosmic-text's font system with another stack (for example fontique) or
# patching cosmic-text. Remove this entry when cosmic-text moves to fontdb 0.24.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Bytescape never opens a network connection. This list repeats the one in
# `cargo xtask net-ban` on purpose: two independent checks, so one mistake in
# either cannot let a networking crate in. The DNS stacks are banned as whole
# families by prefix in `net-ban`; here their known members are listed. The
# crates after `muda` are ruled out for other reasons (a D-Bus crate brings
# sockets; the native-menu crate needs GTK).
#
# An exception to a crate ban is a `wrappers` entry naming the only crates
# allowed to depend on it, with a comment giving the reason, and needs the
# same explicit review as an entry in xtask/net-ban.allow.
#
# `zbus` and `async-io` have one, for the Linux screen-reader adapter
# (`accesskit_unix`, AT-SPI over local D-Bus connections). So do the two crates
# above them, so that this check alone keeps the chain out of the elevated
# helper: `accesskit_unix` may be depended on only by `accesskit_winit`, and
# `accesskit_winit` only by `bytescape`. The condition for all of them is that
# every address the adapter connects to uses exactly the `unix` transport
# (each `;`-separated entry; `unixexec`, `tcp`, `nonce-tcp`, `autolaunch` and
# `launchd` are refused): the session bus (`DBUS_SESSION_BUS_ADDRESS`, or unset
# with `$XDG_RUNTIME_DIR/bus`), `AT_SPI_BUS_ADDRESS`, and the reply of
# `org.a11y.Bus.GetAddress`. The interface checks the AT-SPI address before it
# creates the adapter and pins the checked address for the process, or runs
# without the adapter. A `wrappers` entry only judges direct dependents; that
# every path to the bus crates goes through `accesskit_unix` is checked by
# `cargo xtask net-ban` (see xtask/net-ban.allow).
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "hyper-tls" },
    { crate = "hyper-rustls" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "isahc" },
    { crate = "surf" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio-rustls" },
    { crate = "tokio-native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "socket2" },
    { crate = "async-std" },
    { crate = "async-net" },
    { crate = "async-io", wrappers = ["async-process", "async-signal", "zbus"] },
    { crate = "smol" },
    { crate = "attohttpc" },
    { crate = "minreq" },
    { crate = "h2" },
    { crate = "quinn" },
    { crate = "tungstenite" },
    { crate = "tokio-tungstenite" },
    { crate = "async-tungstenite" },
    { crate = "axum" },
    { crate = "warp" },
    { crate = "actix-web" },
    { crate = "tiny_http" },
    { crate = "tiny-http" },
    { crate = "accesskit_unix", wrappers = ["accesskit_winit"] },
    { crate = "accesskit_winit", wrappers = ["bytescape"] },
    { crate = "zbus", wrappers = ["accesskit_unix", "atspi-common", "atspi-proxies"] },
    { crate = "dbus" },
    { crate = "muda" },
    { crate = "hickory-resolver" },
    { crate = "hickory-proto" },
    { crate = "hickory-client" },
    { crate = "hickory-server" },
    { crate = "hickory-net" },
    { crate = "hickory-dns" },
    { crate = "hickory-recursor" },
    { crate = "trust-dns-resolver" },
    { crate = "trust-dns-proto" },
    { crate = "trust-dns-client" },
    { crate = "trust-dns-server" },
]

# Crate features that open sockets (the Windows `Win32_Networking*` features,
# `tokio` and `mio` with `net`, `rustix` with `net`, and others) are NOT banned
# here, on purpose. cargo-deny judges features on one graph that merges every
# platform together, so a Linux-only dependency that turns on a Windows API
# feature would make it reject the Windows build, and an exception could only
# be written by deleting the ban for every crate. `cargo xtask net-ban`
# resolves features exactly for each of the four targets, and it also supports
# exceptions limited to named parent crates (xtask/net-ban.allow), so all
# feature bans live there.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
