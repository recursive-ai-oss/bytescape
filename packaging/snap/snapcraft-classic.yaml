# The classic edition of the snap, ready for the day the store approves classic
# confinement. It is not published until then: classic confinement needs a
# request to the store, which the maintainers make with a written
# justification.
#
# Classic confinement lets the interface read every file the account can read
# and start the elevated helper through the system's pkexec. The helper is
# packaged in the snap; the snap cannot install a polkit policy, so pkexec
# shows its generic prompt.
#
# Build from the repository root: packaging/snap/build-snap.sh classic
name: bytescape
base: core24
adopt-info: bytescape
summary: See where the space on a drive is used
description: |
  Bytescape scans a drive or folder and draws every file and folder as a box
  whose area is its size, so the biggest things stand out at once. It shows
  what is there and leaves the decisions to you. It never connects to the
  internet. This edition can read the whole file system, and starts its
  separate administrator helper only when you ask for a full scan or a delete
  that needs administrator rights.
grade: stable
confinement: classic
license: MIT OR Apache-2.0
contact: https://github.com/recursive-ai-oss/bytescape/issues
issues: https://github.com/recursive-ai-oss/bytescape/issues
source-code: https://github.com/recursive-ai-oss/bytescape
website: https://github.com/recursive-ai-oss/bytescape
compression: lzo

apps:
  bytescape:
    command: bin/bytescape
    extensions: [gnome]
    common-id: org.recursiveai.bytescape
    desktop: usr/share/applications/org.recursiveai.bytescape.desktop

parts:
  bytescape:
    plugin: rust
    source: .
    # The interface and the helper.
    rust-path: [crates/bytescape, crates/bytescape-helper]
    rust-channel: "1.99.0"
    build-packages:
      - pkg-config
    build-environment:
      - SOURCE_DATE_EPOCH: "$(git -C $CRAFT_PART_SRC log -1 --format=%ct 2>/dev/null || echo 0)"
    override-build: |
      craftctl default
      install -Dm644 packaging/linux/org.recursiveai.bytescape.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.recursiveai.bytescape.desktop"
      # A snap's menu entry points at the icon inside the snap.
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/bytescape.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/org.recursiveai.bytescape.desktop"
      install -Dm644 packaging/linux/org.recursiveai.bytescape.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/org.recursiveai.bytescape.metainfo.xml"
      craftctl set version="$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"name":"bytescape","version":"\([^"]*\)".*/\1/p' | head -1)"
