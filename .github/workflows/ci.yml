name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so advisories published against the dependencies are noticed
    # even when nothing is merged.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Read-only token for every job. No job here needs to write, and pull
# requests from forks run exactly like branches of this repository. There are
# no secrets in CI.
permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces, so superseded
# runs stop using paid runner minutes. Every other run (each push to main, each
# manual run, the weekly run) has a group of its own, named after its commit,
# so nothing is ever cancelled or replaced and every commit on main keeps its
# own result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # Every job, formatting and lints included, uses the one release pinned in
  # rust-toolchain.toml, so a new compiler's lints arrive in a deliberate
  # change instead of failing unrelated pull requests.

# Every step runs in bash, on Windows too, so the commands are the same on
# every leg and match what CONTRIBUTING.md tells you to run.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The cache key already includes the operating system and CPU, so a
      # Linux cache is never restored on Windows.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The job limit is the sum of its step limits plus 15 minutes for checkout,
    # toolchain and cache, so a step's own limit is always what ends a hang.
    # Linux: 5 + 5 (fetch) + 15 (btrfs-progs) + 20 + 15 (ext4) + 15 (btrfs) +
    # 15 (mounts) + 20 = 110, limit 125. Windows: 5 + 10 + 5 + 20 = 40, limit
    # 55.
    timeout-minutes: ${{ matrix.limit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            limit: 125
          - os: windows-2025
            limit: 55
    env:
      # These runners are throwaway machines, so tests that change operating
      # system state (Recycle Bin, Trash, deletes) may run here. Never set
      # this on a machine you care about. On Linux the flag is left off for
      # the main run: the tests it switches on there mount file systems and
      # need root, so they run in their own step below, as root.
      BYTESCAPE_DISPOSABLE_HOST: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every dependency of every target, so a test that asks cargo about
      # another target (the helper's no-program test lists the Windows
      # closure, offline) finds its sources. Plain `cargo test` fetches only
      # what the running machine builds.
      - name: Fetch every dependency
        timeout-minutes: 5
        run: cargo fetch --locked
      # The build date comes from the commit time, so rebuilding one commit
      # gives the same date.
      - name: Set the build date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor. Two
      # tests need them, and a test that cannot run would pass quietly, so the
      # restriction is lifted on this throwaway runner. btrfs-progs is for the
      # test that builds a btrfs file system; e2fsprogs for the ext4 images the
      # scanner and helper tests build; xfsprogs for the XFS reader tests.
      - name: Allow user namespaces, install file system tools
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs e2fsprogs xfsprogs
      # The btrfs image tests make their file systems with `mkfs.btrfs --subvol`,
      # which Ubuntu 24.04's btrfs-progs (6.6) lacks. This builds a pinned,
      # checksummed upstream release (6.17.1: `--subvol` needs 6.12 and
      # `--compress` 6.13, and 6.10 and 6.11 drop hard links under `--rootdir`)
      # and puts it first on PATH.
      - name: Build btrfs-progs with --subvol (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: packaging/ci/build-btrfs-progs.sh
      # The helper starts itself with administrator rights on Windows, which
      # needs an elevated account, and a prompt would wait for a click that
      # never comes. It gets its own step with its own limit, so a stuck test
      # costs ten minutes and names itself, and does not use up the job.
      - name: Helper and file operation tests (Windows)
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 10
        run: cargo test --locked --no-fail-fast -p bs-fsops -p bs-ipc -p bs-platform -p bytescape-helper -- --nocapture --test-threads=1 2>&1 | tee helper-tests.log
      # A test that cannot do its job prints NOT RUN and still passes, so a
      # green run alone does not show that the launch, pipe, elevation and
      # delete tests for Windows ran. This step reads the log for them.
      - name: Check that the Windows helper tests ran
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        timeout-minutes: 5
        run: bash packaging/ci/check-windows-helper-tests.sh helper-tests.log
      # The four packages above ran one test at a time. They are left out here:
      # run in parallel they fight over the Recycle Bin, which is what the
      # one-at-a-time step avoids. It runs even when the step above failed, so
      # one run shows both results.
      - name: Tests (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked --no-fail-fast --workspace --exclude bs-fsops --exclude bs-ipc --exclude bs-platform --exclude bytescape-helper
      - name: Tests (Linux)
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 20
        run: cargo test --locked --no-fail-fast --workspace
      # The raw ext4 reader's image tests build ext4 images with mke2fs and
      # compare them with the walker and with debugfs (both from e2fsprogs).
      - name: Raw ext4 reader image tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 15
        run: cargo test --locked -p bs-scan-ext4 --features image-tests --no-fail-fast
      # The btrfs reader's image tests build btrfs images with mkfs.btrfs and
      # read them without mounting, through a parser of the image's B-trees.
      - name: Raw btrfs reader image tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 15
        # Without these the tests print NOT RUN and pass when mkfs.btrfs lacks
        # the option; with them a missing option fails the step.
        env:
          BYTESCAPE_REQUIRE_BTRFS_SUBVOL: "1"
          BYTESCAPE_REQUIRE_BTRFS_COMPRESS: "1"
        run: cargo test --locked -p bs-scan-btrfs --features image-tests --no-fail-fast
      # Tests that mount real file systems inside a private user and mount
      # namespace. Without the variable they print NOT RUN and pass when the
      # namespace cannot be made; with it they fail instead, so a runner that
      # loses the ability to make one turns the job red and never skips quietly.
      - name: Namespace mount tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 15
        env:
          BYTESCAPE_REQUIRE_NAMESPACES: "1"
        run: |
          # The three are independent, so all of them run and the step fails
          # at the end if any did.
          status=0
          cargo test --locked --no-fail-fast -p bs-scan-xfs --test mount_real -- --nocapture || status=1
          cargo test --locked --no-fail-fast -p bs-scan-btrfs --lib mounts -- --nocapture || status=1
          cargo test --locked --no-fail-fast -p bs-platform --lib delete -- --nocapture || status=1
          exit "$status"
      # The tests that need a private namespace or root, run for real. The
      # script fails when any of them reports NOT RUN.
      - name: Namespace and root tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 20
        env:
          BYTESCAPE_DISPOSABLE_HOST: "1"
        run: bash packaging/ci/linux-privileged-tests.sh

  # The finished Windows helper, read as a file: it imports nothing that starts
  # another program, it is linked to look for DLLs in the system folder only,
  # and a DLL planted beside it (a bcryptprimitives.dll whose DllMain writes a
  # file) is not loaded when it starts. The release build is the one that
  # counts, so this builds it. The runner is an elevated account, which the
  # helper's manifest needs for the last check.
  windows-helper-binary:
    name: windows helper binary
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the helper
        timeout-minutes: 25
        run: cargo build --release --locked -p bytescape-helper
      - name: Imports, DLL search and the DLL canary
        timeout-minutes: 10
        run: python packaging/windows/check-helper.py all target/release/bytescape-helper.exe

  # The Debian package and polkit: both actions are known, and pkexec starts the
  # helper as root without the desktop's DISPLAY and XAUTHORITY. It builds the
  # package (a release build, slow), so it runs on request and weekly.
  polkit-pkexec:
    name: polkit and pkexec
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install the packaging tools
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config dpkg-dev
          cargo install --locked cargo-deb@3.8.0
      - name: Build the .deb
        timeout-minutes: 30
        run: packaging/linux/build-deb.sh --out dist
      - name: Install it in a clean container and run pkexec
        timeout-minutes: 10
        run: |
          deb="$(ls dist/*.deb)"
          docker run --rm --memory=4g -v "$PWD:/repo:ro" -v "$PWD/dist:/pkg:ro" ubuntu:24.04 \
            bash /repo/packaging/ci/polkit-pkexec-test.sh "/pkg/$(basename "$deb")"

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # Licenses, advisories, banned crates and allowed sources (crates.io
      # only), as configured in deny.toml.
      - run: cargo deny check

  # The project's own checks. Each one is a `cargo xtask` command, so you can
  # run the same thing locally. Every step runs even when an earlier one fails,
  # so a single run shows all the problems.
  guards:
    name: guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: No networking crates or code
        run: cargo xtask net-ban
      - name: Helper dependency allowlist
        if: ${{ !cancelled() }}
        run: cargo xtask helper-deps
      - name: No private references in public text
        if: ${{ !cancelled() }}
        run: cargo xtask public-text
      - name: Unsafe code only where it is allowed
        if: ${{ !cancelled() }}
        run: cargo xtask unsafe-allow
      # The checker for the finished Windows helper has its own tests (the
      # file layout it reads, and that its list of program-starting imports
      # matches the helper's source test).
      - name: Helper check script tests
        if: ${{ !cancelled() }}
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" packaging/windows/test_check_helper.py

  wording:
    name: wording (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The notes shipped inside the program are checked by their own tests,
      # with a list that is stricter than the wording rule.
      - name: Knowledge tables wording
        run: cargo test --locked --no-fail-fast -p bs-knowledge
      # The shipped prose (README, changelog, docs, issue forms and package
      # listings) and the words inside the program: string literals in the
      # interface crates and the notes in the knowledge tables.
      - name: Prose and interface wording
        if: ${{ !cancelled() }}
        run: cargo xtask wording

  # ARM64 legs. GitHub provides these runners free of charge to public
  # repositories only, so the job waits for a repository variable instead of
  # queueing forever on a runner that does not exist. A maintainer sets
  # `ARM64_CI` to `true` (Settings, Secrets and variables, Actions, Variables)
  # when the repository goes public. It is a separate job, so it can be left
  # out of the required checks until it has proven stable.
  arm64:
    name: arm64 (${{ matrix.os }})
    if: ${{ vars.ARM64_CI == 'true' }}
    runs-on: ${{ matrix.os }}
    # Sum of the step limits below (Linux 5 + 5 + 20 + 20 + 15 + 20 + 10,
    # Windows 5 + 20 + 10 + 20 + 10) plus 15 minutes for checkout, toolchain
    # and cache.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    env:
      # Same rule as the test job: on Linux the root-only tests run in their
      # own step.
      BYTESCAPE_DISPOSABLE_HOST: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every dependency of every target, so a test that asks cargo about
      # another target (the helper's no-program test lists the Windows
      # closure, offline) finds its sources. Plain `cargo test` fetches only
      # what the running machine builds.
      - name: Fetch every dependency
        timeout-minutes: 5
        run: cargo fetch --locked
      - name: Allow user namespaces, install file system tools
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs e2fsprogs xfsprogs
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # On Windows the four packages that need one test at a time run in their
      # own step, as in the test job, and are left out here.
      - name: Helper and file operation tests (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        timeout-minutes: 10
        run: cargo test --locked --no-fail-fast -p bs-fsops -p bs-ipc -p bs-platform -p bytescape-helper -- --nocapture --test-threads=1 2>&1 | tee helper-tests.log
      # A test that cannot do its job prints NOT RUN and still passes, so a
      # green run alone does not show that the launch, pipe, elevation and
      # delete tests for Windows ran. This step reads the log for them.
      - name: Check that the Windows helper tests ran
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        timeout-minutes: 5
        run: bash packaging/ci/check-windows-helper-tests.sh helper-tests.log
      - name: Tests (Windows)
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked --no-fail-fast --workspace --exclude bs-fsops --exclude bs-ipc --exclude bs-platform --exclude bytescape-helper
      - name: Tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked --no-fail-fast --workspace
      # Tests that mount real file systems inside a private user and mount
      # namespace. Without the variable they print NOT RUN and pass when the
      # namespace cannot be made; with it they fail instead, so a runner that
      # loses the ability to make one turns the job red and never skips quietly.
      - name: Namespace mount tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 15
        env:
          BYTESCAPE_REQUIRE_NAMESPACES: "1"
        run: |
          # The three are independent, so all of them run and the step fails
          # at the end if any did.
          status=0
          cargo test --locked --no-fail-fast -p bs-scan-xfs --test mount_real -- --nocapture || status=1
          cargo test --locked --no-fail-fast -p bs-scan-btrfs --lib mounts -- --nocapture || status=1
          cargo test --locked --no-fail-fast -p bs-platform --lib delete -- --nocapture || status=1
          exit "$status"
      - name: Namespace and root tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        timeout-minutes: 20
        env:
          BYTESCAPE_DISPOSABLE_HOST: "1"
        run: bash packaging/ci/linux-privileged-tests.sh
      - name: Project checks
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo xtask guards

  # Cold-cache walker benchmark. It needs the operating system's file cache to
  # be emptied before each run, which takes root, so it runs on the
  # GitHub-hosted runner (passwordless sudo, throwaway machine) and only on
  # request or on the weekly schedule. It is not a required check and never
  # runs on pull requests. The benchmark itself lives in the script named
  # below; the job skips with a notice until that script exists.
  bench-cold:
    name: bench-cold
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The script empties the file cache with sudo and writes large data
      # sets; it must refuse to run anywhere that is not a throwaway machine.
      BYTESCAPE_DISPOSABLE_HOST: "1"
      BENCH_SCRIPT: crates/bs-scan/bench/walker-bench.sh
      BENCH_RESULTS: ${{ github.workspace }}/bench-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the benchmark script
        id: script
        run: |
          if [ -f "$BENCH_SCRIPT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=bench-cold skipped::$BENCH_SCRIPT does not exist yet, so there is nothing to measure. The job runs for real once the script is added."
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.script.outputs.present == 'true'
      - name: Build release
        if: steps.script.outputs.present == 'true'
        timeout-minutes: 20
        run: cargo build --release --locked --workspace
      - name: Check that the file cache can be emptied
        if: steps.script.outputs.present == 'true'
        run: |
          test "$BYTESCAPE_DISPOSABLE_HOST" = 1
          mkdir -p "$BENCH_RESULTS"
          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          # Where the numbers came from goes next to them: the commit, the
          # time, the compiler, the hardware and the file system.
          {
            echo "## commit"; git rev-parse HEAD
            echo "## date (UTC)"; date -u +%FT%TZ
            echo "## compiler"; rustc -Vv
            echo "## cpu"; lscpu
            echo "## memory"; free -h
            echo "## block devices"; lsblk -o NAME,SIZE,ROTA,TYPE,FSTYPE,MOUNTPOINT
            echo "## file systems"; df -hT
            echo "## kernel"; uname -a
            echo "## runner image"; echo "${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > "$BENCH_RESULTS/machine.txt" 2>&1
      # The script builds the data set, empties the cache with
      # `sync; echo 3 | sudo tee /proc/sys/vm/drop_caches` before each run, runs
      # the walker and the reference tools cold, and writes raw results into
      # $BENCH_RESULTS.
      - name: Run the cold-cache benchmark
        if: steps.script.outputs.present == 'true'
        timeout-minutes: 45
        run: |
          status=0
          bash "$BENCH_SCRIPT" || status=$?
          # The script exits 1 when a tool's total differs from the walker's
          # or the tree changed during the runs. The timings are then not a
          # valid comparison, so the job must be red and say why.
          if [ "$status" -eq 1 ]; then
            echo "::error title=Benchmark totals differ::A reference tool reported a different total from the walker, or the data changed during the runs. The timings are not a valid comparison; see summary.md in the uploaded results."
          fi
          exit "$status"
      # The raw reader reads the root device directly, so the job fails here,
      # loudly, when the root file system is not ext4.
      - name: Run the raw ext4 reader benchmark
        if: ${{ !cancelled() && steps.script.outputs.present == 'true' }}
        timeout-minutes: 40
        run: |
          fstype="$(findmnt -no FSTYPE /)"
          echo "root file system: $fstype"
          if [ "$fstype" != ext4 ]; then
            echo "::error title=Root is not ext4::the raw reader benchmark needs an ext4 root file system, found $fstype"
            exit 1
          fi
          device="/dev/block/$(awk '$5=="/" {print $3; exit}' /proc/self/mountinfo)"
          BENCH_RESULTS="$BENCH_RESULTS/ext4" \
            bash crates/bs-scan-ext4/bench/ext4-bench.sh --device "$device" --mount / --runs 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.script.outputs.present == 'true' }}
        with:
          name: bench-cold-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: error

  # Cold-cache speed of the btrfs and XFS readers against the walker, one job
  # each so that a slow or failed one does not use up the other's time. Same
  # rules as bench-cold: throwaway runner with passwordless sudo, only on
  # request or on the weekly schedule. Each script builds what it needs and
  # empties the file cache before every cold run.
  bench-cold-btrfs:
    name: bench-cold (btrfs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BYTESCAPE_DISPOSABLE_HOST: "1"
      BENCH_RESULTS: ${{ github.workspace }}/bench-results/btrfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install btrfs tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
      # One script for both file systems: it builds a generated data set of
      # known size, checks that it fits before copying, runs the benchmark and
      # writes what was copied into summary.md.
      - name: Run the btrfs reader benchmark
        timeout-minutes: 60
        run: packaging/ci/bench-image.sh btrfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-cold-btrfs-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: error

  bench-cold-xfs:
    name: bench-cold (xfs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BYTESCAPE_DISPOSABLE_HOST: "1"
      BENCH_RESULTS: ${{ github.workspace }}/bench-results/xfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install XFS tools
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs
      - name: Run the XFS reader benchmark
        timeout-minutes: 60
        run: packaging/ci/bench-image.sh xfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-cold-xfs-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: error

  # The io_uring statx experiment, cold: the page, dentry and inode caches are
  # dropped before every timed run, which takes root, so it runs on the
  # GitHub-hosted runner (passwordless sudo, throwaway machine) and only on
  # request or on the weekly schedule. It measures and records; it does not
  # decide anything by itself. The script refuses to run (exit 3) instead of
  # measuring warm when it is not root or cannot empty the caches. Hosted
  # runners have virtual SSDs, so a run on a rotational disk needs a
  # self-hosted runner.
  iouring-cold:
    name: iouring-cold
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the benchmark script
        id: script
        run: |
          if [ -f crates/bs-scan/bench/uring-bench.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iouring-cold skipped::crates/bs-scan/bench/uring-bench.sh does not exist yet, so there is nothing to measure."
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.script.outputs.present == 'true'
      # Built as the runner's own user first, so the run as root below does
      # not install a toolchain or leave root-owned files in the target folder.
      - name: Build the benchmark programs
        if: steps.script.outputs.present == 'true'
        timeout-minutes: 20
        run: cargo build --release --locked -p bs-scan --features iouring-bench --examples
      - name: io_uring statx experiment (cold, page cache + dentries + inodes dropped before every run)
        if: steps.script.outputs.present == 'true'
        timeout-minutes: 30
        env:
          BYTESCAPE_DISPOSABLE_HOST: "1"
          BENCH_RESULTS: ${{ runner.temp }}/uring-bench
          BENCH_RUNS: "10"
        run: |
          sudo -E env "PATH=$PATH" crates/bs-scan/bench/uring-bench.sh --threads 4,16 --depths 128,512 --async off
          sudo -E env "PATH=$PATH" BENCH_RESULTS="$BENCH_RESULTS-sink-tree" \
            crates/bs-scan/bench/uring-bench.sh --sink tree --threads 4,16 --depths 128 --async off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.script.outputs.present == 'true' }}
        with:
          name: iouring-cold
          path: ${{ runner.temp }}/uring-bench*
          if-no-files-found: error

  # The NTFS table reader on Linux (images made with ntfs-3g) and on Windows
  # (virtual disks made with diskpart, and the runner's own system drive).
  ntfs-linux:
    name: ntfs (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ntfs-3g
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ntfs-3g fuse3
      # The runner cannot mount FUSE file systems as an ordinary user, so the
      # test programs are built as the user and run as root.
      - name: Reader tests with images (as root)
        timeout-minutes: 30
        run: |
          cargo test --locked -p bs-scan-ntfs --features image-tests --no-run --message-format=json > build.json
          jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .executable!=null) | .executable' build.json > exes.txt
          cat exes.txt
          test -s exes.txt
          cd crates/bs-scan-ntfs
          fail=0
          : > ../../ntfs-test.log
          while read -r exe; do
            sudo -E env BYTESCAPE_DISPOSABLE_HOST=1 "$exe" --nocapture --test-threads=1 2>&1 | tee -a ../../ntfs-test.log || fail=1
          done < ../../exes.txt
          # A test that cannot do its job prints NOT RUN and still passes, and
          # a skipped test is not a result.
          if grep -q 'NOT RUN' ../../ntfs-test.log; then
            echo "::error title=Tests did not run::a test above printed NOT RUN"
            grep 'NOT RUN' ../../ntfs-test.log
            fail=1
          fi
          exit "$fail"

  ntfs-windows:
    name: ntfs (windows-2025)
    runs-on: windows-2025
    # 15 for checkout, toolchain and cache, 120 for the reader tests (the walk
    # of the system drive alone may take up to 90 minutes, watched for
    # progress), 40 for the timed run. A cold walk of C: on a hosted runner
    # takes about 17 minutes.
    timeout-minutes: 175
    env:
      BYTESCAPE_DISPOSABLE_HOST: "1"
      # Strict: any difference between the reader and the walker fails the
      # test. The value `report` only lists differences, for diagnosis.
      BYTESCAPE_NTFS_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Built in release mode: one test walks the runner's whole system drive
      # with the directory walker, and a debug build is far slower at that.
      - name: Reader tests on virtual disks and the system drive
        timeout-minutes: 120
        run: |
          cargo test --locked --release --no-fail-fast -p bs-scan-ntfs -- --nocapture --test-threads=1 2>&1 | tee ntfs-test.log
          # A test that cannot do its job prints NOT RUN and still passes, and
          # a skipped test is not a result.
          if grep -q 'NOT RUN' ntfs-test.log; then
            echo "::error title=Tests did not run::a test above printed NOT RUN"
            grep 'NOT RUN' ntfs-test.log
            exit 1
          fi
      # The timing run takes a long time and is not needed to judge a change,
      # so it runs only when asked for and on the weekly schedule.
      - name: Reader against walker, timed
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        timeout-minutes: 40
        env:
          BYTESCAPE_NTFS_BENCH: "1"
          BENCH_FILES: "100000"
          BENCH_OUT: ${{ github.workspace }}/ntfs-results/ntfs-speed.md
        run: |
          mkdir -p ntfs-results
          cargo test --locked --release -p bs-scan-ntfs --test windows_speed -- --nocapture --test-threads=1 2>&1 | tee ntfs-speed.log
          if grep -q 'NOT RUN' ntfs-speed.log; then
            echo "::error title=Tests did not run::the timing test printed NOT RUN"
            exit 1
          fi
      # A missing table fails the job: the run is not evidence without it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        with:
          name: ntfs-windows-${{ github.run_id }}
          path: ntfs-results/
          if-no-files-found: error
