name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so advisories published against the dependencies are noticed
    # even when nothing is merged.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Read-only token for every job. No job here needs to write, and pull
# requests from forks run exactly like branches of this repository. There are
# no secrets in CI.
permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces, so superseded
# runs stop using paid runner minutes. Every other run (each push to main, each
# manual run, the weekly run) has a group of its own, named after its commit,
# so nothing is ever cancelled or replaced and every commit on main keeps its
# own result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # Every job, formatting and lints included, uses the one release pinned in
  # rust-toolchain.toml, so a new compiler's lints arrive in a deliberate
  # change instead of failing unrelated pull requests.

# Every step runs in bash, on Windows too, so the commands are the same on
# every leg and match what CONTRIBUTING.md tells you to run.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The cache key already includes the operating system and CPU, so a
      # Linux cache is never restored on Windows.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      # These runners are throwaway machines, so tests that change operating
      # system state (Recycle Bin, Trash, deletes) may run here. Never set
      # this on a machine you care about. On Linux the flag is left off for
      # the main run: the tests it switches on there mount file systems and
      # need root, so they run in their own step below, as root.
      BYTESCAPE_DISPOSABLE_HOST: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The build date comes from the commit time, so rebuilding one commit
      # gives the same date.
      - name: Set the build date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor. Two
      # tests need them, and a test that cannot run would pass quietly, so the
      # restriction is lifted on this throwaway runner. btrfs-progs is for the
      # test that builds a btrfs file system.
      - name: Allow user namespaces, install btrfs tools
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
      - run: cargo test --locked --workspace
      # The raw ext4 reader's image tests build ext4 images with mke2fs and
      # compare them with the walker and with debugfs (both from e2fsprogs).
      - name: Raw ext4 reader image tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: cargo test --locked -p bs-scan-ext4 --features image-tests --no-fail-fast
      # The tests that need a private namespace or root, run for real. The
      # script fails when any of them reports NOT RUN.
      - name: Namespace and root tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        env:
          BYTESCAPE_DISPOSABLE_HOST: "1"
        run: bash packaging/ci/linux-privileged-tests.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # Licenses, advisories, banned crates and allowed sources (crates.io
      # only), as configured in deny.toml.
      - run: cargo deny check

  # The project's own checks. Each one is a `cargo xtask` command, so you can
  # run the same thing locally. Every step runs even when an earlier one fails,
  # so a single run shows all the problems.
  guards:
    name: guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: No networking crates or code
        run: cargo xtask net-ban
      - name: Helper dependency allowlist
        if: ${{ !cancelled() }}
        run: cargo xtask helper-deps
      - name: No private references in public text
        if: ${{ !cancelled() }}
        run: cargo xtask public-text
      - name: Unsafe code only where it is allowed
        if: ${{ !cancelled() }}
        run: cargo xtask unsafe-allow

  wording:
    name: wording (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The notes shipped inside the program are checked by their own tests,
      # with a list that is stricter than the wording rule.
      - name: Knowledge tables wording
        run: cargo test --locked -p bs-knowledge
      # The shipped prose (README, changelog, docs, issue forms and package
      # listings) and the words inside the program: string literals in the
      # interface crates and the notes in the knowledge tables.
      - name: Prose and interface wording
        if: ${{ !cancelled() }}
        run: cargo xtask wording

  # ARM64 legs. GitHub provides these runners free of charge to public
  # repositories only, so the job waits for a repository variable instead of
  # queueing forever on a runner that does not exist. A maintainer sets
  # `ARM64_CI` to `true` (Settings, Secrets and variables, Actions, Variables)
  # when the repository goes public. It is a separate job, so it can be left
  # out of the required checks until it has proven stable.
  arm64:
    name: arm64 (${{ matrix.os }})
    if: ${{ vars.ARM64_CI == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    env:
      # Same rule as the test job: on Linux the root-only tests run in their
      # own step.
      BYTESCAPE_DISPOSABLE_HOST: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Allow user namespaces, install btrfs tools
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace
      - name: Namespace and root tests (Linux)
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        env:
          BYTESCAPE_DISPOSABLE_HOST: "1"
        run: bash packaging/ci/linux-privileged-tests.sh
      - name: Project checks
        if: ${{ !cancelled() }}
        run: cargo xtask guards

  # Cold-cache walker benchmark. It needs the operating system's file cache to
  # be emptied before each run, which takes root, so it runs on the
  # GitHub-hosted runner (passwordless sudo, throwaway machine) and only on
  # request or on the weekly schedule. It is not a required check and never
  # runs on pull requests. The benchmark itself lives in the script named
  # below; the job skips with a notice until that script exists.
  bench-cold:
    name: bench-cold
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The script empties the file cache with sudo and writes large data
      # sets; it must refuse to run anywhere that is not a throwaway machine.
      BYTESCAPE_DISPOSABLE_HOST: "1"
      BENCH_SCRIPT: crates/bs-scan/bench/walker-bench.sh
      BENCH_RESULTS: ${{ github.workspace }}/bench-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the benchmark script
        id: script
        run: |
          if [ -f "$BENCH_SCRIPT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=bench-cold skipped::$BENCH_SCRIPT does not exist yet, so there is nothing to measure. The job runs for real once the script is added."
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.script.outputs.present == 'true'
      - name: Build release
        if: steps.script.outputs.present == 'true'
        run: cargo build --release --locked --workspace
      - name: Check that the file cache can be emptied
        if: steps.script.outputs.present == 'true'
        run: |
          test "$BYTESCAPE_DISPOSABLE_HOST" = 1
          mkdir -p "$BENCH_RESULTS"
          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          # Where the numbers came from goes next to them: the commit, the
          # time, the compiler, the hardware and the file system.
          {
            echo "## commit"; git rev-parse HEAD
            echo "## date (UTC)"; date -u +%FT%TZ
            echo "## compiler"; rustc -Vv
            echo "## cpu"; lscpu
            echo "## memory"; free -h
            echo "## block devices"; lsblk -o NAME,SIZE,ROTA,TYPE,FSTYPE,MOUNTPOINT
            echo "## file systems"; df -hT
            echo "## kernel"; uname -a
            echo "## runner image"; echo "${ImageOS:-unknown} ${ImageVersion:-unknown}"
          } > "$BENCH_RESULTS/machine.txt" 2>&1
      # The script builds the data set, empties the cache with
      # `sync; echo 3 | sudo tee /proc/sys/vm/drop_caches` before each run, runs
      # the walker and the reference tools cold, and writes raw results into
      # $BENCH_RESULTS.
      - name: Run the cold-cache benchmark
        if: steps.script.outputs.present == 'true'
        run: |
          status=0
          bash "$BENCH_SCRIPT" || status=$?
          # The script exits 1 when a tool's total differs from the walker's
          # or the tree changed during the runs. The timings are then not a
          # valid comparison, so the job must be red and say why.
          if [ "$status" -eq 1 ]; then
            echo "::error title=Benchmark totals differ::A reference tool reported a different total from the walker, or the data changed during the runs. The timings are not a valid comparison; see summary.md in the uploaded results."
          fi
          exit "$status"
      # The raw reader reads the root device directly, so the job fails here,
      # loudly, when the root file system is not ext4.
      - name: Run the raw ext4 reader benchmark
        if: ${{ !cancelled() && steps.script.outputs.present == 'true' }}
        run: |
          fstype="$(findmnt -no FSTYPE /)"
          echo "root file system: $fstype"
          if [ "$fstype" != ext4 ]; then
            echo "::error title=Root is not ext4::the raw reader benchmark needs an ext4 root file system, found $fstype"
            exit 1
          fi
          device="/dev/block/$(awk '$5=="/" {print $3; exit}' /proc/self/mountinfo)"
          BENCH_RESULTS="$BENCH_RESULTS/ext4" \
            bash crates/bs-scan-ext4/bench/ext4-bench.sh --device "$device" --mount / --runs 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.script.outputs.present == 'true' }}
        with:
          name: bench-cold-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: error
