name: Set up Rust
description: Installs the Rust release pinned in rust-toolchain.toml, with the components listed there. Run after checkout.

runs:
  using: composite
  steps:
    # BYTESCAPE_SKIP_WINRES=1 skips the Windows resources so a developer can
    # lint Windows code without a resource compiler. A build made that way has
    # no icon, version information or administrator manifest, so no CI or
    # release job may run with it. Every job that builds uses this action.
    - name: Refuse a build that skips the Windows resources
      shell: bash
      run: |
        if [ -n "${BYTESCAPE_SKIP_WINRES:-}" ]; then
          echo "::error title=Windows resources skipped::BYTESCAPE_SKIP_WINRES is set. It is for local linting only and must not be set in CI or release builds."
          exit 1
        fi
    # The pin lives in one place, rust-toolchain.toml. Reading it here (instead
    # of repeating the version in this workflow) keeps every job, the lints
    # included, on the same compiler, and works with any rustup version.
    - name: Install the pinned toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
        test -n "$channel" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
        rustup default "$channel"
