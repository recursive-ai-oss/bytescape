name: Feature request
description: Something Bytescape doesn't do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you ask: some things are out of scope by design: a macOS version, themes, renaming or moving files, network features, and advice about what to remove. See [Why use it, and why not](https://github.com/recursive-ai-oss/bytescape#why-use-it-and-why-not) in the README.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How you do it now, or why you can't.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. A sketch is enough.
