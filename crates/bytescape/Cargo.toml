[package]
name = "bytescape"
description = "Bytescape: the disk-space visualizer (the user interface, never elevated)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bs-render = { path = "../bs-render" }
bs-knowledge = { path = "../bs-knowledge" }
bs-layout = { path = "../bs-layout" }
bs-platform = { path = "../bs-platform" }
bs-scan = { path = "../bs-scan" }
bs-tree = { path = "../bs-tree" }
bs-ui = { path = "../bs-ui" }
winit = { workspace = true }
accesskit_winit = { workspace = true }

# Screen readers on Linux speak AT-SPI over the local session bus.
[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { workspace = true, features = ["accesskit_unix", "async-io"] }
