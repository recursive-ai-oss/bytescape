# Paths that are blocked or protected against deletion.
#
# blocked    Never offered for deletion. The operating system's own folders.
# protected  Deleted only after a stronger confirmation that repeats the note.
#            The note says what the path is and who manages it; a test in this
#            crate rejects notes that give advice.
#
# This is the one table both the interface and the elevated helper check
# against, so they cannot disagree.
#
# Fields
#   pattern  Where the path is. `/` separates parts on both systems. `~` is the
#            user's home folder, `%NAME%` an environment variable (an unset
#            variable switches the entry off, which is why the main folders
#            are listed by their usual drive as well), `*` and `?` match inside
#            one part, and `?:` is any drive letter.
#   os       "windows", "linux" or "any" (default "any").
#   level    "blocked" or "protected".
#   scope    "subtree" (default): the path and everything below it.
#            "exact": only the path itself.
#   note     Required for protected entries, optional for blocked ones.

# ---------------------------------------------------------------- Windows

[[entry]]
pattern = "?:"
os = "windows"
level = "blocked"
scope = "exact"
note = "The root of a drive."

[[entry]]
pattern = "%SystemRoot%"
os = "windows"
level = "blocked"
note = "The Windows folder, managed by Windows."

[[entry]]
pattern = "C:/Windows"
os = "windows"
