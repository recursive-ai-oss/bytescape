# Folders that Bytescape recognizes, each with a short factual note.
#
# A note says what the folder is and who manages it. It never says whether
# anything can or should be deleted: a test in this crate rejects notes that
# do. Only list a folder when its purpose and owner are documented.
#
# Fields
#   pattern   Where the folder is. `/` separates parts on both systems.
#             `~` is the user's home folder, `%NAME%` an environment variable,
#             `**/name` a folder of that name anywhere, `*` and `?` match
#             inside one part. Patterns match the folder itself.
#   os        "windows", "linux" or "any" (default "any").
#   category  video, images, audio, documents, archives, apps-system,
#             code-dev, cache-temp or other.
#   contents  "inherit" (default): files inside take the category.
#             "own": only the folder has it; files keep their own category.
#   note      The factual note.
#   handoff   Optional: "uninstall", "disk-cleanup" or "package", the tool
#             that owns the folder (see the interface notes in the crate).

