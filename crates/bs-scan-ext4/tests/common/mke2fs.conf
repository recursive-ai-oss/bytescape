# The file system features the image tests build with, so that an image does
# not depend on the defaults of whatever mke2fs the host has. Newer mke2fs
# versions turn on features (the orphan file, for one) that change which
# inodes a fresh image holds. A test that wants a feature asks for it with an
# explicit `-O`. Set BYTESCAPE_FIXTURE_HOST_MKE2FS=1 to build with the host's
# own configuration instead, to check that the tests do not rely on this one.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize
	}
	small = {
		inode_ratio = 4096
	}
	floppy = {
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
