[package]
name = "bs-platform"
description = "Bytescape platform services: trash, reveal, drives, elevation launch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs for drive capacity.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Volume, drive and registry calls. No networking feature is enabled.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
