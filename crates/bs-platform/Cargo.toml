[package]
name = "bs-platform"
description = "Bytescape platform services: trash, reveal and other shell handoffs, installed-software lookup, clipboard, folder dialog, drives, elevation launch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The protected-path table that every delete is checked against.
bs-knowledge = { path = "../bs-knowledge" }

[target.'cfg(unix)'.dependencies]
# statvfs for drive capacity.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Volume, drive and registry calls. No networking feature is enabled.
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    # COM, for the shell's file operation that moves items to the Recycle Bin.
    "Win32_System_Com",
    # Clipboard text, the local time zone, and the system folder.
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    # The real Windows version, for the crash report.
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
