[package]
name = "bs-scan"
description = "Bytescape scanner trait and the parallel walker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# A statx-through-io_uring variant of the Linux walker, for measuring only.
# Off by default; adds no dependency (the ring is driven with raw system
# calls through `libc`) and nothing in the shipped programs enables it.
iouring-bench = []

[dependencies]
bs-tree = { path = "../bs-tree" }
# The category tables. No dependencies of its own.
bs-knowledge = { path = "../bs-knowledge" }

# Directory handles, getdents64 and statx.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Directory enumeration by handle. No networking feature is enabled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Examples and tests build the boundary and the progress figure from the
# platform's drive list, as the application does.
bs-platform = { path = "../bs-platform" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true

[[example]]
name = "uring_bench"
required-features = ["iouring-bench"]

[[test]]
name = "iouring"
required-features = ["iouring-bench"]
