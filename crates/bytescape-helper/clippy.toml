msrv = "1.99"

# The helper never starts another program: it has no use for one, and a bug
# that could be steered into running a command would run it with
# administrator rights. `tests/no_spawn.rs` checks the sources of everything
# the helper links as well.
disallowed-types = [
    { path = "std::process::Command", reason = "the helper never starts other programs" },
    { path = "std::net::TcpStream", reason = "Bytescape never connects to the internet" },
    { path = "std::net::TcpListener", reason = "Bytescape never connects to the internet" },
    { path = "std::net::UdpSocket", reason = "Bytescape never connects to the internet" },
]
disallowed-methods = [
    { path = "std::os::unix::process::CommandExt::exec", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "std::process::Command::new", reason = "the helper never starts other programs" },
    { path = "windows_sys::Win32::System::Threading::CreateProcessA", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::Threading::CreateProcessW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::Threading::CreateProcessAsUserA", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::Threading::CreateProcessAsUserW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::Threading::CreateProcessWithLogonW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::Threading::CreateProcessWithTokenW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteA", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteExA", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::UI::Shell::ShellExecuteExW", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "windows_sys::Win32::System::WindowsProgramming::WinExec", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::system", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::popen", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::fork", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::vfork", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execv", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execve", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execvp", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execvpe", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execl", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execle", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::execlp", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::fexecve", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::posix_spawn", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "libc::posix_spawnp", reason = "the helper never starts other programs", allow-invalid = true },
    { path = "std::env::set_current_dir", reason = "the helper works with absolute paths only" },
]
