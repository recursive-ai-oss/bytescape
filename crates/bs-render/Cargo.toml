[package]
name = "bs-render"
description = "Bytescape drawing interface and software renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tiny-skia = { workspace = true }
softbuffer = { workspace = true }
raw-window-handle = { workspace = true }
cosmic-text = { workspace = true }
wgpu = { workspace = true }

# System font discovery through fontconfig on Linux; Windows reads its font
# directory directly.
[target.'cfg(unix)'.dependencies]
cosmic-text = { workspace = true, features = ["fontconfig"] }
